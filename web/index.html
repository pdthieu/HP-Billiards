<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool</title>
<link rel="preload" href="/fonts/SourceSans3-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/SourceSans3-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/components.css">
<link rel="stylesheet" href="/style.css">
</head>
<body class="pool pool-app">

<header id="top" class="hdr">
  <div class="hdr__room">
    <span class="eyebrow">Room</span>
    <span id="roomCode" class="hdr__code">—</span>
    <button id="copyLink" class="btn btn--secondary btn--small" title="Copy an invite link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"></path></svg><span>Copy link</span></button>
  </div>
  <div class="hdr__match">
    <div class="seat" id="seat0"></div>
    <div class="score score--empty" id="score" aria-label="No score yet"><span class="score__vs">vs</span></div>
    <div class="seat" id="seat1"></div>
  </div>
</header>

<main class="game">
  <div id="tableWrap" class="stage">
    <canvas id="table" class="stage__table"></canvas>
    <div id="powerBar" class="pbar" hidden>
      <div id="powerTrack" class="pbar__track" role="slider" tabindex="0" aria-label="Shot power: press and pull down, release to shoot" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
        <div id="powerLast" class="pbar__last"></div>
        <div id="powerFill" class="pbar__fill"></div>
        <div class="pbar__cancel" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></div>
        <div class="pbar__label" aria-hidden="true"><svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3l5 5 5-5"></path><path d="M2 12l5 5 5-5"></path></svg><span>Pull</span></div>
      </div>
      <span id="powerReadout" class="pbar__readout" hidden></span>
    </div>
  </div>

  <div id="status" class="status" aria-live="polite">
    <span class="status__pill status__layer is-active" hidden></span>
    <span class="status__pill status__layer" hidden></span>
  </div>

  <div id="controls" class="slot">
    <section id="lobbyPanel" class="panel panel--center" aria-label="Lobby" hidden>
      <div class="panel__group panel__group--center">
        <p id="lobbyText" class="panel__msg"></p>
        <p id="lobbySub" class="panel__sub"></p>
      </div>
      <button id="ready" class="btn btn--primary btn--lg">I’m ready</button>
      <button id="lobbyCopy" class="btn btn--secondary btn--lg" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"></path></svg>Copy invite link</button>
    </section>

    <section id="shotPanel" class="panel" aria-label="Your shot" hidden>
      <div class="call">
        <p id="callText" class="call__line"></p>
        <div class="call__actions">
          <button id="safety" class="toggle" aria-pressed="false"><span class="toggle__box"></span>Safety</button>
          <button id="clearCall" class="btn btn--quiet btn--small" hidden>Clear</button>
          <span id="handTag" class="tag tag--ready" hidden>ball in hand</span>
        </div>
        <p id="powerHint" class="hint">Pull the bar to shoot · <kbd>←</kbd> <kbd>→</kbd> aim · <kbd>Enter</kbd> shoots
          <button class="icon-btn hint__close" id="hintClose" type="button" aria-label="Hide this hint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></p>
      </div>
      <div class="panel__sep"></div>
      <div class="angle">
        <span class="field__label">Angle</span>
        <div class="angle__row">
          <button class="nudge" data-deg="-5" aria-label="Rotate minus 5 degrees">−5°</button>
          <button class="nudge" data-deg="-0.25" aria-label="Rotate minus 0.25 degrees">−0.25°</button>
          <output id="angleText" class="angle__readout">0.0°</output>
          <button class="nudge" data-deg="0.25" aria-label="Rotate plus 0.25 degrees">+0.25°</button>
          <button class="nudge" data-deg="5" aria-label="Rotate plus 5 degrees">+5°</button>
        </div>
      </div>
      <div class="panel__sep"></div>
      <div class="spin">
        <div id="spinPad" class="spin__pad" role="slider" tabindex="0" aria-label="Spin: where the tip strikes the cue ball" aria-valuetext="centre">
          <span class="spin__cross"></span>
          <span id="spinLimit" class="spin__limit"></span>
          <span id="spinDot" class="spin__dot"></span>
        </div>
        <div class="spin__meta">
          <span class="field__label">Spin</span>
          <span id="spinText" class="spin__label">centre</span>
          <button id="spinReset" class="btn btn--quiet btn--small">Reset</button>
        </div>
      </div>
    </section>

    <section id="waitPanel" class="panel panel--center" aria-label="Waiting" hidden>
      <span id="waitHold" class="hold hold--big" hidden></span>
      <div class="panel__group panel__group--center">
        <p id="waitText" class="panel__msg"></p>
        <p id="waitSub" class="panel__sub"></p>
      </div>
    </section>

    <section id="overPanel" class="panel panel--between" aria-label="Game over" hidden>
      <div class="panel__group">
        <p id="overText" class="panel__title"></p>
        <p id="rematchNote" class="panel__sub"></p>
      </div>
      <div class="panel__actions">
        <button id="leaveGame" class="btn btn--quiet">Leave</button>
        <button id="rematch" class="btn btn--primary btn--lg">Rematch</button>
      </div>
    </section>
  </div>

  <div id="trays" class="trays" aria-label="Pocketed balls">
    <div class="tray" id="traySolids"></div>
    <div class="tray tray--right" id="trayStripes"></div>
  </div>
</main>

<div id="landing" class="landing">
  <form id="landingForm" class="card landing__card" novalidate>
    <div id="landingBrand" class="landing__brand">
      <span class="wordmark">POOL</span>
      <span class="caption">8-ball · WPA rules · called shots</span>
    </div>
    <div id="landingInvite" class="landing__invite" hidden>
      <span class="wordmark wordmark--small">POOL</span>
      <h1 id="landingTitle" class="landing__title">Join room <span id="landingCode" class="code-text"></span></h1>
      <p id="landingLead" class="landing__lead"></p>
    </div>
    <div class="field" id="nameField">
      <label class="field__label" for="name">Your name</label>
      <div class="input-group">
        <input class="input" id="name" maxlength="20" autocomplete="nickname" placeholder="Enter your name">
        <button class="icon-btn" type="button" id="shuffleName" aria-label="Suggest another name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></button>
      </div>
      <span class="field__msg" id="nameError" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg><span>Enter a name so your opponent knows who you are.</span></span>
    </div>
    <div id="createRow" class="landing__create">
      <button type="button" id="create" class="btn btn--primary btn--lg btn--block">Create a room</button>
      <p id="createNote" class="note" hidden><svg class="note__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg><span></span></p>
    </div>
    <hr class="divider" id="roomsDivider">
    <section class="rooms" id="roomsBox" aria-labelledby="rooms-h">
      <div class="rooms__head">
        <h2 class="eyebrow" id="rooms-h">Rooms</h2>
        <span class="caption" id="roomsCount"></span>
      </div>
      <ul id="roomList"></ul>
    </section>
    <div class="join-row" id="joinRow">
      <div class="field" id="codeField">
        <label class="field__label" for="code">Join by code</label>
        <input class="input input--code" id="code" placeholder="ABCDE" maxlength="5" autocapitalize="characters" spellcheck="false">
      </div>
      <button type="submit" id="join" class="btn btn--secondary">Join</button>
    </div>
    <p id="landingError" class="note note--foul" hidden><svg class="note__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg><span></span></p>
    <p id="switchMode" class="landing__switch" hidden><a class="link" href="/">Create your own room instead</a></p>
  </form>
</div>

<div id="decision" class="overlay" hidden>
  <div class="card">
    <h2 id="decisionTitle"></h2>
    <p id="decisionText" class="muted"></p>
    <div id="decisionOptions" class="options"></div>
  </div>
</div>

<div id="disconnected" class="overlay" hidden>
  <div class="card">
    <h2>Connection lost</h2>
    <p id="disconnectedText" class="muted"></p>
    <div class="row">
      <button id="rejoin" class="btn btn--primary">Rejoin</button>
      <button id="leave" class="btn btn--quiet">Leave</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
