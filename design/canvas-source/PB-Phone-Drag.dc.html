<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool · pulling the power bar · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pool phone game mk-still">
  <header class="hdr" style="padding: 0 8px 0 12px; gap: 6px">
    <div class="hdr__room" style="gap: 0">
      <span class="hdr__code" style="font-size: 17px; letter-spacing: .12em">QXRTA</span>
      <button class="icon-btn" type="button" aria-label="Share invite link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg></button>
    </div>
    <div class="hdr__match" style="gap: 6px">
      <div class="seat seat--compact seat--turn">
        <div class="seat__body">
          <div class="seat__line"><span class="seat__name">Ann</span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none" aria-hidden="true"></span></div>
          <div class="seat__dots"><span class="ball" style="--c: var(--ball-1)"></span><span class="ball ball--gone" style="--c: var(--ball-2)"></span><span class="ball" style="--c: var(--ball-3)"></span><span class="ball" style="--c: var(--ball-4)"></span><span class="ball ball--gone" style="--c: var(--ball-5)"></span><span class="ball" style="--c: var(--ball-6)"></span><span class="ball ball--gone" style="--c: var(--ball-7)"></span></div>
        </div>
      </div>
      <div class="score score--compact"><div class="score__nums"><span class="score__slot"><span>2</span></span><span class="score__sep">–</span><span class="score__slot"><span>1</span></span></div><span class="score__race">to 5</span></div>
      <div class="seat seat--compact">
        <div class="seat__body">
          <div class="seat__line"><span class="seat__name">Bob</span></div>
          <div class="seat__dots"><span class="ball ball--stripe" style="--c: var(--ball-1)"></span><span class="ball ball--stripe" style="--c: var(--ball-2)"></span><span class="ball ball--gone" style="--c: var(--ball-3)"></span><span class="ball ball--stripe" style="--c: var(--ball-4)"></span><span class="ball ball--gone" style="--c: var(--ball-5)"></span><span class="ball ball--stripe" style="--c: var(--ball-6)"></span><span class="ball ball--stripe" style="--c: var(--ball-7)"></span></div>
        </div>
      </div>
    </div>
  </header>

  <div class="stage" style="flex: none; height: 499px">
    <img class="stage__table" src="./img/aim-P.svg" alt="Table with the 3 called; the cue pulls back as power rises" style="height: 487px; width: 261px">
    <div class="pbar pbar--drag" style="height: 487px">
      <div class="pbar__track" role="slider" tabindex="0" aria-label="Shot power" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
        <div class="pbar__cancel"></div>
        <div class="pbar__fill" style="height: 62%; background: linear-gradient(180deg, var(--power-low) 0px, var(--power-mid) 268px, var(--power-high) 487px)"></div>
      </div>
      <span class="pbar__readout" style="top: 62%">62%</span>
      <span class="touch" style="left: 20px; top: 62%"></span>
    </div>
  </div>

  <div class="status" aria-live="polite">Release to shoot. Slide back to the top to cancel.</div>

  <div class="slot" style="opacity: .45">
    <section class="panel" aria-label="Your shot" aria-disabled="true">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 36px">
        <p class="call__line call__line--called" style="flex: 1; min-width: 0">Called: <span class="call__value">the 3</span></p>
        <button class="toggle" type="button" aria-pressed="false" disabled><span class="toggle__box"></span>Safety</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div class="angle" style="gap: 6px; flex: 1; min-width: 0">
          <div style="display: flex; align-items: baseline; gap: 8px"><span class="field__label">Angle</span><output class="angle__readout" style="min-width: 0; text-align: left; font-size: 20px; line-height: 24px">321.7°</output></div>
          <div class="angle__row"><button class="nudge" type="button" disabled>−5</button><button class="nudge" type="button" disabled>−.25</button><button class="nudge" type="button" disabled>+.25</button><button class="nudge" type="button" disabled>+5</button></div>
        </div>
        <div class="spin__pad" style="--pad: 72px" aria-hidden="true"><span class="spin__cross"></span><span class="spin__limit"></span><span class="spin__dot" style="left: 36%; top: 30%"></span></div>
      </div>
    </section>
  </div>

  <div class="trays" aria-label="Pocketed balls">
    <div class="tray"><span class="tray__label">Solids</span><span class="ball" style="--c: var(--ball-2)"></span><span class="ball" style="--c: var(--ball-5)"></span><span class="ball" style="--c: var(--ball-7)"></span></div>
    <div class="tray"><span class="ball ball--stripe" style="--c: var(--ball-3)"></span><span class="ball ball--stripe" style="--c: var(--ball-5)"></span><span class="tray__label" style="margin: 0 0 0 6px">Stripes</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
