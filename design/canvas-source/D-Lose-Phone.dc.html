<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool · game over, loss · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pool phone game mk-frame">
  <header class="hdr" style="padding: 0 8px 0 12px; gap: 6px">
    <div class="hdr__room" style="gap: 0"><span class="hdr__code" style="font-size: 17px; letter-spacing: .12em">QXRTA</span><button class="icon-btn" type="button" aria-label="Share invite link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg></button></div>
    <div class="hdr__match" style="gap: 6px">
      <div class="seat seat--compact"><span class="seat__name">Ann</span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none" aria-hidden="true"></span></div>
      <div class="score score--compact" aria-label="Score 2 to 2, race to 5"><div class="score__nums"><span class="score__slot"><span>2</span></span><span class="score__sep">–</span><span class="score__slot"><span>2</span></span></div><span class="score__race">to 5</span></div>
      <div class="seat seat--compact"><span class="seat__name">Bob</span></div>
    </div>
  </header>
  <div class="stage" style="flex: none; height: 499px">
    <div class="stage__wrap">
      <img class="stage__table" src="./img/plain-P.svg" alt="" style="height: 487px; width: 261px; filter: saturate(.7) brightness(.8)">
    </div>
    <div class="pbar pbar--disabled" style="height: 487px" aria-hidden="true"><div class="pbar__track"></div></div>
    <div class="result" role="status" style="left: 0; right: 0; padding: 18px 16px">
      <p class="result__title" style="font-size: 36px; line-height: 40px">Bob wins the rack</p>
      <p class="result__reason" style="font-size: 15px; line-height: 22px">The 8 went down before your group was cleared. 2 – 2, still a race to 5.</p>
    </div>
  </div>
  <div class="status">Bob levels the match at 2 – 2.</div>
  <div class="slot">
    <section class="panel panel--center">
      <p style="font: 600 24px/28px var(--font-display)">Bob takes it · <span class="tnum">2 – 2</span></p>
      <div style="display: flex; gap: 8px; width: 100%">
        <button class="btn btn--quiet" type="button">Leave</button>
        <button class="btn btn--primary" type="button" style="flex: 1">Rematch</button>
      </div>
      <p class="panel__sub">You break the next rack.</p>
    </section>
  </div>
  <div class="trays"><div class="tray"><span class="tray__label">Rack 4 of up to 9</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
