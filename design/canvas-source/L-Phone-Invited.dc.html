<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool · invited · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pool mk-frame" style="width: 390px; height: 800px">
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop__table" src="./img/rack-P.svg" alt="" style="height: 760px">
  </div>
  <main class="landing" style="align-items: flex-end; padding: 47px 12px 34px">
    <form class="card landing__card" style="padding: 24px 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="wordmark" style="font-size: 18px; line-height: 22px; color: var(--text-muted)">POOL</span>
        <h1 class="landing__title">Join room <span class="code-text" style="font-size: 26px">ABCDE</span></h1>
        <p class="landing__lead">Ann is at the table and waiting for an opponent.</p>
      </div>
      <div class="field">
        <label class="field__label" for="name">Your name</label>
        <div class="input-group">
          <input class="input" id="name" value="Keen Osprey" maxlength="20" autocomplete="nickname">
          <button class="icon-btn" type="button" aria-label="Suggest another name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></button>
        </div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Join</button>
      <p style="text-align: center; font-size: 14px; line-height: 20px; padding-bottom: 4px"><a class="link" href="#create">Create your own room instead</a></p>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
