<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool · connection lost · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pool phone game mk-frame">
  <header class="hdr" style="padding: 0 8px 0 12px; gap: 6px">
    <div class="hdr__room" style="gap: 0"><span class="hdr__code" style="font-size: 17px; letter-spacing: .12em">QXRTA</span><button class="icon-btn" type="button" aria-label="Share invite link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg></button></div>
    <div class="hdr__match" style="gap: 6px">
      <div class="seat seat--compact"><span class="seat__name">Ann</span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none" aria-hidden="true"></span></div>
      <div class="score score--compact"><div class="score__nums"><span>2</span><span class="score__sep">–</span><span>1</span></div><span class="score__race">to 5</span></div>
      <div class="seat seat--compact seat--theirs"><span class="seat__name">Bob</span></div>
    </div>
  </header>
  <div class="stage" style="flex: none; height: 499px"><img class="stage__table" src="./img/opp-P.svg" alt="" style="height: 487px; width: 261px"><div class="pbar pbar--disabled" style="height: 487px" aria-hidden="true"><div class="pbar__track"></div></div></div>
  <div class="status">Bob’s turn.</div>
  <div class="slot"><section class="panel panel--center"><p class="panel__msg"><strong>Bob’s turn.</strong></p></section></div>

  <div class="scrim" role="presentation" style="backdrop-filter: blur(3px) saturate(.6)">
    <section class="conn" role="alertdialog" aria-labelledby="c-t" aria-describedby="c-d">
      <div class="conn__head">
        <span class="conn__icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 4.2-2.6"></path><path d="M10.7 5.1A15 15 0 0 1 22 8.8"></path><path d="M5 12.9a10 10 0 0 1 5.2-2.7"></path><path d="M16.5 11.4a10 10 0 0 1 2.5 1.5"></path><path d="M8.5 16.4a5 5 0 0 1 7 0"></path><path d="M12 20h.01"></path><path d="M3 3l18 18"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 class="conn__title" id="c-t">Connection lost</h2>
          <p class="conn__text" id="c-d">Reconnecting… Your seat is held for 60 seconds.</p>
        </div>
      </div>
      <div class="retry" role="status" aria-live="polite">
        <div class="retry__steps" aria-hidden="true">
          <span class="retry__step retry__step--done"></span>
          <span class="retry__step retry__step--done"></span>
          <span class="retry__step retry__step--now" style="--p: .4"></span>
          <span class="retry__step"></span>
          <span class="retry__step"></span>
        </div>
        <div class="retry__meta"><span>Try 3 · next in 1.2 s</span><span>Seat held 52 s</span></div>
      </div>
      <div class="conn__actions">
        <button class="btn btn--quiet" type="button">Leave</button>
        <button class="btn btn--secondary" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>Retry now</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
