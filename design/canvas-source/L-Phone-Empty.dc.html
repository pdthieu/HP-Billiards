<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool · empty list and name error · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pool mk-frame" style="width: 390px; height: 800px">
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop__table" src="./img/rack-P.svg" alt="" style="height: 760px">
  </div>
  <main class="landing" style="align-items: flex-end; padding: 47px 12px 34px">
    <form class="card landing__card" style="gap: 18px; padding: 22px 20px">
      <div class="landing__brand">
        <span class="wordmark">POOL</span>
        <span class="caption">8-ball · called shots</span>
      </div>
      <div class="field field--shake">
        <label class="field__label" for="name">Your name</label>
        <div class="input-group">
          <input class="input input--error" id="name" placeholder="Enter your name" maxlength="20" autocomplete="nickname" aria-invalid="true" aria-describedby="name-err">
          <button class="icon-btn" type="button" aria-label="Suggest a name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></button>
        </div>
        <span class="field__msg" id="name-err"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>Enter a name so your opponent knows who you are.</span>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="button">Create a room</button>
      <hr class="divider">
      <section class="rooms" aria-labelledby="rooms-h">
        <div class="rooms__head">
          <h2 class="eyebrow" id="rooms-h">Rooms</h2>
          <span class="caption">0 of 3 in use</span>
        </div>
        <div class="rooms__empty">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="15" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"></circle><circle cx="20" cy="20" r="5" fill="currentColor" fill-opacity=".35"></circle></svg>
          <p style="font: 600 16px/22px var(--font-ui)">No rooms yet.</p>
          <p class="caption" style="font-size: 14px; line-height: 20px">Create one and send the link to a friend.</p>
        </div>
      </section>
      <div class="join-row">
        <div class="field">
          <label class="field__label" for="code">Join by code</label>
          <input class="input input--code" id="code" placeholder="ABCDE" maxlength="5" autocapitalize="characters" spellcheck="false">
        </div>
        <button class="btn btn--secondary" type="submit">Join</button>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
