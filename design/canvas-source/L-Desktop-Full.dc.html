<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool · home at room limit · desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pool mk-frame" style="width: 1100px; height: 720px">
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop__table" src="./img/rack-L.svg" alt="" style="width: 1080px">
  </div>
  <main class="landing">
    <form class="card landing__card" style="gap: 16px; padding: 24px 28px">
      <div class="landing__brand">
        <span class="wordmark">POOL</span>
        <span class="caption">8-ball · WPA rules · called shots</span>
      </div>
      <div class="field">
        <label class="field__label" for="name">Your name</label>
        <div class="input-group">
          <input class="input" id="name" value="Keen Osprey" maxlength="20" autocomplete="nickname">
          <button class="icon-btn" type="button" aria-label="Suggest another name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></button>
        </div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="button" disabled aria-describedby="limit">Create a room</button>
      <div class="note" id="limit" role="status">
        <svg class="note__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
        <span>All 3 rooms are in use. Join one below.</span>
      </div>
      <section class="rooms" aria-labelledby="rooms-h">
        <div class="rooms__head">
          <h2 class="eyebrow" id="rooms-h">Rooms</h2>
          <span class="caption">3 of 3 in use</span>
        </div>
        <ul>
          <li class="room-row">
            <span class="room-row__code">QXRTA</span>
            <div class="room-row__who">
              <span class="room-row__names">Ann <span class="room-row__vs">vs</span> Bob</span>
              <span class="chip chip--playing"><span class="chip__dot"></span>playing</span>
            </div>
            <button class="btn btn--secondary btn--small" type="button" disabled>Full</button>
          </li>
          <li class="room-row">
            <span class="room-row__code">MBWEK</span>
            <div class="room-row__who">
              <span class="room-row__names">Minh Trang</span>
              <span class="chip chip--lobby"><span class="chip__dot"></span>lobby</span>
            </div>
            <button class="btn btn--secondary btn--small" type="button">Join</button>
          </li>
          <li class="room-row" style="animation-delay: 80ms">
            <span class="room-row__code">TPKEZ</span>
            <div class="room-row__who">
              <span class="room-row__names room-row__names--empty">empty</span>
              <span class="chip chip--finished"><span class="chip__dot"></span>finished</span>
            </div>
            <button class="btn btn--secondary btn--small" type="button">Join</button>
          </li>
        </ul>
      </section>
      <div class="join-row">
        <div class="field">
          <label class="field__label" for="code">Join by code</label>
          <input class="input input--code" id="code" placeholder="ABCDE" maxlength="5" autocapitalize="characters" spellcheck="false">
        </div>
        <button class="btn btn--secondary" type="submit">Join</button>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
