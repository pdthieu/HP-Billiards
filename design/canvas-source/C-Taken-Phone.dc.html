<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pool · seat taken over · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pool phone game mk-frame">
  <header class="hdr" style="padding: 0 8px 0 12px; gap: 6px">
    <div class="hdr__room" style="gap: 0"><span class="hdr__code" style="font-size: 17px; letter-spacing: .12em">QXRTA</span><button class="icon-btn" type="button" aria-label="Share invite link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg></button></div>
    <div class="hdr__match" style="gap: 6px">
      <div class="seat seat--compact"><span class="seat__name">Ann</span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none" aria-hidden="true"></span></div>
      <div class="score score--compact"><div class="score__nums"><span>2</span><span class="score__sep">–</span><span>1</span></div><span class="score__race">to 5</span></div>
      <div class="seat seat--compact"><span class="seat__name">Bob</span></div>
    </div>
  </header>
  <div class="stage" style="flex: none; height: 499px"><img class="stage__table" src="./img/plain-P.svg" alt="" style="height: 487px; width: 261px"><div class="pbar pbar--disabled" style="height: 487px" aria-hidden="true"><div class="pbar__track"></div></div></div>
  <div class="status"></div>
  <div class="slot"><section class="panel panel--center"></section></div>

  <div class="scrim" role="presentation" style="backdrop-filter: blur(3px) saturate(.6)">
    <section class="conn" role="alertdialog" aria-labelledby="c-t" aria-describedby="c-d">
      <div class="conn__head">
        <span class="conn__icon" aria-hidden="true" style="background: var(--accent-soft); color: var(--accent-text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="13" height="10" rx="2"></rect><rect x="14" y="9" width="8" height="12" rx="2"></rect><path d="M6 18h5"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 class="conn__title" id="c-t">Playing somewhere else?</h2>
          <p class="conn__text" id="c-d">This seat was taken over by another connection, probably another tab or device. Only one can hold a seat.</p>
        </div>
      </div>
      <div class="conn__actions">
        <button class="btn btn--quiet" type="button">Leave</button>
        <button class="btn btn--primary" type="button">Play here</button>
      </div>
      <p class="caption">No automatic retry: rejoining here disconnects the other one.</p>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
