<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool · decision dialog · desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;background:#0D1218}</style>
</head>
<body>
<!-- Static mock-up exported from the Pool design canvas (Prompt 06). -->
<div class="pool game mk-frame" style="width: 1100px; height: 720px">
  <header class="hdr">
    <div class="hdr__room">
      <span class="eyebrow">Room</span>
      <span class="hdr__code">QXRTA</span>
      <button class="btn btn--secondary btn--small" type="button">Copy link</button>
    </div>
    <div class="hdr__match">
      <div class="seat seat--turn is-moving"><div class="seat__line"><span class="seat__name">Ann</span><span class="tag tag--you">you</span></div><span class="seat__state">deciding</span></div>
      <div class="score"><div class="score__nums"><span>2</span><span class="score__sep">–</span><span>1</span></div><span class="score__race">race to 5</span></div>
      <div class="seat"><div class="seat__line"><span class="seat__name">Bob</span></div></div>
    </div>
  </header>
  <div class="stage" style="flex: none; height: 468px">
    <img class="stage__table" src="../../img/rack-L.svg" alt="" style="height: 448px; width: 835px">
    <div class="pbar pbar--disabled" style="height: 448px" aria-hidden="true"><div class="pbar__track"></div></div>
  </div>
  <div class="status status--foul"><span class="status__pill"><svg class="status__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>Illegal break by Bob.</span></div>
  <div class="slot"><section class="panel panel--center"><p class="panel__msg">Your decision.</p></section></div>

  <div class="scrim" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="eyebrow" style="color: var(--foul)">Your decision</span>
        <h2 class="dialog__title" id="dlg-t">Illegal break</h2>
        <p class="dialog__text" id="dlg-d">Bob broke illegally: nothing was pocketed and fewer than four balls reached a rail.</p>
      </div>
      <div class="dialog__options">
        <button class="option option--primary is-focus" type="button" style="animation-delay: 0ms">
          <span class="option__text"><span class="option__title">Play from here</span><span class="option__sub">Accept the balls where they lie. You shoot next.</span></span>
          <svg class="option__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button class="option" type="button" style="animation-delay: 40ms">
          <span class="option__text"><span class="option__title">Re-rack, I break</span><span class="option__sub">Start the rack again with your break.</span></span>
          <svg class="option__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button class="option" type="button" style="animation-delay: 80ms">
          <span class="option__text"><span class="option__title">Re-rack, Bob breaks again</span><span class="option__sub">He gets another try at a legal break.</span></span>
          <svg class="option__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
