<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool · phone portrait · ball in hand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;background:#0D1218}</style>
</head>
<body>
<!-- Static mock-up exported from the Pool design canvas (Prompt 08). -->
<div class="pool phone game mk-frame">
  <header class="hdr" style="padding: 0 8px 0 12px; gap: 6px">
    <div class="hdr__room" style="gap: 0"><span class="hdr__code" style="font-size: 17px; letter-spacing: .12em">QXRTA</span><button class="icon-btn" type="button" aria-label="Share invite link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg></button></div>
    <div class="hdr__match" style="gap: 6px">
      <div class="seat seat--compact seat--turn">
        <div class="seat__body">
          <div class="seat__line"><span class="seat__name">Ann</span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none" aria-hidden="true"></span></div>
          <div class="seat__dots"><span class="ball" style="--c: var(--ball-1)"></span><span class="ball ball--gone" style="--c: var(--ball-2)"></span><span class="ball" style="--c: var(--ball-3)"></span><span class="ball" style="--c: var(--ball-4)"></span><span class="ball ball--gone" style="--c: var(--ball-5)"></span><span class="ball" style="--c: var(--ball-6)"></span><span class="ball ball--gone" style="--c: var(--ball-7)"></span></div>
        </div>
      </div>
      <div class="score score--compact"><div class="score__nums"><span class="score__slot"><span>2</span></span><span class="score__sep">–</span><span class="score__slot"><span>1</span></span></div><span class="score__race">to 5</span></div>
      <div class="seat seat--compact">
        <div class="seat__body">
          <div class="seat__line"><span class="seat__name">Bob</span></div>
          <div class="seat__dots"><span class="ball ball--stripe" style="--c: var(--ball-1)"></span><span class="ball ball--stripe" style="--c: var(--ball-2)"></span><span class="ball ball--gone" style="--c: var(--ball-3)"></span><span class="ball ball--stripe" style="--c: var(--ball-4)"></span><span class="ball ball--gone" style="--c: var(--ball-5)"></span><span class="ball ball--stripe" style="--c: var(--ball-6)"></span><span class="ball ball--stripe" style="--c: var(--ball-7)"></span></div>
        </div>
      </div>
    </div>
  </header>

  <div class="stage" style="flex: none; height: 499px">
    <img class="stage__table" src="../../img/hand-P.svg" alt="Ball in hand: the kitchen is washed and the head string turns green" style="height: 487px; width: 261px">
    <div class="pbar" style="height: 487px">
      <div class="pbar__track" role="slider" tabindex="0" aria-label="Shot power" aria-valuenow="0">
        <div class="pbar__last" style="height: 35%"></div>
        <div class="pbar__cancel" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></div>
        <div class="pbar__label" aria-hidden="true"><svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3l5 5 5-5"></path><path d="M2 12l5 5 5-5"></path></svg><span>Pull</span></div>
      </div>
    </div>
  </div>
  <span class="touch" style="left: 174px; top: 500px"></span>
  <div class="toast toast--info" role="status" style="position: absolute; left: 32px; right: 70px; top: 300px; max-width: none">
    <svg class="toast__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a2 2 0 0 1 4 0v6"></path><path d="M12 11V9a2 2 0 0 1 4 0v3"></path><path d="M16 12a2 2 0 0 1 4 0v3a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L5 14a2 2 0 0 1 3-2.5"></path></svg>
    <span>Drag the white ball to place it anywhere in the shaded area.</span>
    <button class="icon-btn toast__close" type="button" aria-label="Got it" style="width: 36px; height: 36px; color: var(--toast-text)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </div>

  <div class="status status--foul"><span class="status__pill" style="padding: 0 12px; border-radius: 12px; text-align: left">Bob scratched on the break. Ball in hand behind the line.</span></div>

  <div class="slot">
    <section class="panel" aria-label="Your shot">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 36px">
        <p class="call__line" style="flex: 1; min-width: 0">Place the ball, then call.</p>
        <button class="toggle" type="button" aria-pressed="false"><span class="toggle__box"></span>Safety</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div class="angle" style="gap: 6px; flex: 1; min-width: 0">
          <div style="display: flex; align-items: baseline; gap: 8px"><span class="field__label">Angle</span><output class="angle__readout" style="min-width: 0; text-align: left; font-size: 20px; line-height: 24px">0.0°</output></div>
          <div class="angle__row"><button class="nudge" type="button" aria-label="Rotate minus 5 degrees">−5</button><button class="nudge" type="button" aria-label="Rotate minus 0.25 degrees">−.25</button><button class="nudge" type="button" aria-label="Rotate plus 0.25 degrees">+.25</button><button class="nudge" type="button" aria-label="Rotate plus 5 degrees">+5</button></div>
        </div>
        <div class="spin__meta" style="width: 62px; align-items: flex-end; text-align: right; gap: 2px"><span class="spin__label" style="font-size: 13px; line-height: 18px">centre</span><button class="btn btn--quiet btn--small" type="button" style="padding: 0 6px; margin-right: -6px" disabled>Reset</button></div>
        <div class="spin__pad" role="slider" tabindex="0" aria-label="Spin" aria-valuetext="centre" style="--pad: 72px"><span class="spin__cross"></span><span class="spin__limit"></span><span class="spin__dot" style="left: 50%; top: 50%"></span></div>
      </div>
    </section>
  </div>

  <div class="trays" aria-label="Pocketed balls">
    <div class="tray"><span class="tray__label">Solids</span><span class="ball" style="--c: var(--ball-2)"></span><span class="ball" style="--c: var(--ball-5)"></span><span class="ball" style="--c: var(--ball-7)"></span></div>
    <div class="tray"><span class="ball ball--stripe" style="--c: var(--ball-3)"></span><span class="ball ball--stripe" style="--c: var(--ball-5)"></span><span class="tray__label" style="margin: 0 0 0 6px">Stripes</span></div>
  </div>
</div>
</body>
</html>
