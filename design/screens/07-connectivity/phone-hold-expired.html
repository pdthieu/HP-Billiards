<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool · hold expired, back in the lobby · phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;background:#0D1218}</style>
</head>
<body>
<!-- Static mock-up exported from the Pool design canvas (Prompt 07). -->
<div class="pool phone game mk-frame">
  <header class="hdr" style="padding: 0 8px 0 12px; gap: 6px">
    <div class="hdr__room" style="gap: 0"><span class="hdr__code" style="font-size: 17px; letter-spacing: .12em">QXRTA</span><button class="icon-btn" type="button" aria-label="Share invite link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg></button></div>
    <div class="hdr__match" style="gap: 6px">
      <div class="seat seat--compact"><span class="seat__name">Ann</span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none" aria-hidden="true"></span></div>
      <div class="score score--compact score--empty"><div class="score__nums"><span>0</span><span class="score__sep">–</span><span>0</span></div><span class="score__race">to 5</span></div>
      <div class="seat seat--compact seat--empty"><span class="seat__name" style="font-weight: 400">Open</span></div>
    </div>
  </header>
  <div class="stage" style="flex: none; height: 499px"><img class="stage__table" src="../../img/rack-P.svg" alt="" style="height: 487px; width: 261px"></div>
  <div class="status status--foul"><span class="status__pill"><svg class="status__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>The game was abandoned.</span></div>
  <div class="slot">
    <section class="panel panel--center">
      <p class="panel__msg">Bob didn’t come back in time.</p>
      <button class="btn btn--secondary btn--lg btn--block" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg>Invite someone else</button>
      <p class="panel__sub">The room stays open. The score starts again.</p>
    </section>
  </div>
</div>
</body>
</html>
