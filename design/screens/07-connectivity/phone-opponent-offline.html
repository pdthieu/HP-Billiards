<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool · opponent offline · phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;background:#0D1218}</style>
</head>
<body>
<!-- Static mock-up exported from the Pool design canvas (Prompt 07). -->
<div class="pool phone game mk-frame">
  <header class="hdr" style="padding: 0 8px 0 12px; gap: 6px">
    <div class="hdr__room" style="gap: 0"><span class="hdr__code" style="font-size: 17px; letter-spacing: .12em">QXRTA</span><button class="icon-btn" type="button" aria-label="Share invite link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path></svg></button></div>
    <div class="hdr__match" style="gap: 6px">
      <div class="seat seat--compact"><span class="seat__name">Ann</span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none" aria-hidden="true"></span></div>
      <div class="score score--compact"><div class="score__nums"><span>2</span><span class="score__sep">–</span><span>1</span></div><span class="score__race">to 5</span></div>
      <div class="seat seat--compact seat--offline" aria-label="Bob, offline, seat held 48 seconds">
        <span class="seat__name">Bob</span>
        <div class="hold" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="var(--hairline-strong)" stroke-width="2.5"></circle><circle cx="13" cy="13" r="11" fill="none" stroke="var(--foul)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="13.8"></circle></svg><span class="hold__num">48</span></div>
      </div>
    </div>
  </header>
  <div class="stage" style="flex: none; height: 499px"><img class="stage__table" src="../../img/plain-P.svg" alt="" style="height: 487px; width: 261px"><div class="pbar pbar--disabled" style="height: 487px" aria-hidden="true"><div class="pbar__track"></div></div></div>
  <div class="status status--foul"><span class="status__pill" style="padding: 0 12px; border-radius: 12px; text-align: left">Bob lost connection. Their seat is held for 60 seconds.</span></div>
  <div class="slot">
    <section class="panel panel--center" style="flex-direction: row; gap: 14px">
      <div class="hold" style="width: 44px; height: 44px" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="var(--hairline-strong)" stroke-width="2"></circle><circle cx="13" cy="13" r="11" fill="none" stroke="var(--foul)" stroke-width="2" stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="13.8"></circle></svg>
        <span class="hold__num" style="font-size: 14px">48</span>
      </div>
      <div class="panel__group" style="text-align: left">
        <p class="panel__msg">Waiting for <strong>Bob</strong> to reconnect…</p>
        <p class="panel__sub" role="timer">If he isn’t back in 48 s, the game ends.</p>
      </div>
    </section>
  </div>
  <div class="trays"><div class="tray"><span class="tray__label">Solids</span><span class="ball" style="--c: var(--ball-2)"></span><span class="ball" style="--c: var(--ball-5)"></span><span class="ball" style="--c: var(--ball-7)"></span></div><div class="tray"><span class="ball ball--stripe" style="--c: var(--ball-3)"></span><span class="ball ball--stripe" style="--c: var(--ball-5)"></span><span class="tray__label" style="margin: 0 0 0 6px">Stripes</span></div></div>
</div>
</body>
</html>
