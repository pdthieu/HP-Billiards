<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool · invited · desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;background:#0D1218}</style>
</head>
<body>
<!-- Static mock-up exported from the Pool design canvas (Prompt 01). -->
<div class="pool mk-frame" style="width: 1100px; height: 720px">
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop__table" src="../../img/rack-L.svg" alt="" style="width: 1080px">
  </div>
  <main class="landing">
    <form class="card landing__card">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="wordmark" style="font-size: 20px; line-height: 24px; color: var(--text-muted)">POOL</span>
        <h1 class="landing__title">Join room <span class="code-text" style="font-size: 26px">ABCDE</span></h1>
        <p class="landing__lead">Ann is at the table and waiting for an opponent.</p>
      </div>
      <div class="field">
        <label class="field__label" for="name">Your name</label>
        <div class="input-group">
          <input class="input is-focus" id="name" value="Keen Osprey" maxlength="20" autocomplete="nickname">
          <button class="icon-btn" type="button" aria-label="Suggest another name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></button>
        </div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Join</button>
      <p style="text-align: center; font-size: 14px; line-height: 20px"><a class="link" href="#create">Create your own room instead</a></p>
    </form>
  </main>
</div>
</body>
</html>
