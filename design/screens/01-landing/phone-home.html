<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool · home · phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;background:#0D1218}</style>
</head>
<body>
<!-- Static mock-up exported from the Pool design canvas (Prompt 01). -->
<div class="pool mk-frame" style="width: 390px; height: 800px">
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop__table" src="../../img/rack-P.svg" alt="" style="height: 760px">
  </div>
  <main class="landing" style="align-items: flex-end; padding: 47px 12px 34px">
    <form class="card landing__card" style="gap: 18px; padding: 22px 20px">
      <div class="landing__brand">
        <span class="wordmark">POOL</span>
        <span class="caption">8-ball · called shots</span>
      </div>
      <div class="field">
        <label class="field__label" for="name">Your name</label>
        <div class="input-group">
          <input class="input" id="name" value="Keen Osprey" maxlength="20" autocomplete="nickname">
          <button class="icon-btn" type="button" aria-label="Suggest another name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></button>
        </div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="button">Create a room</button>
      <hr class="divider">
      <section class="rooms" aria-labelledby="rooms-h">
        <div class="rooms__head">
          <h2 class="eyebrow" id="rooms-h">Rooms</h2>
          <span class="caption">2 of 3 in use</span>
        </div>
        <ul>
          <li class="room-row" style="grid-template-columns: 80px minmax(0, 1fr) auto">
            <span class="room-row__code" style="font-size: 20px">QXRTA</span>
            <div class="room-row__who">
              <span class="room-row__names">Ann <span class="room-row__vs">vs</span> Bob</span>
              <span class="chip chip--playing"><span class="chip__dot"></span>playing</span>
            </div>
            <button class="btn btn--secondary btn--small" type="button" disabled>Full</button>
          </li>
          <li class="room-row" style="grid-template-columns: 80px minmax(0, 1fr) auto; animation-delay: 40ms">
            <span class="room-row__code" style="font-size: 20px">MBWEK</span>
            <div class="room-row__who">
              <span class="room-row__names">Minh Trang</span>
              <span class="chip chip--lobby"><span class="chip__dot"></span>lobby</span>
            </div>
            <button class="btn btn--secondary btn--small" type="button">Join</button>
          </li>
        </ul>
      </section>
      <div class="join-row">
        <div class="field">
          <label class="field__label" for="code">Join by code</label>
          <input class="input input--code" id="code" placeholder="ABCDE" maxlength="5" autocapitalize="characters" spellcheck="false">
        </div>
        <button class="btn btn--secondary" type="submit">Join</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
